[package]
name = "xtion-rs"
version = "0.2.6"
edition = "2021"
rust-version = "1.75"
description = "Pure-Rust userspace driver for the ASUS Xtion / PrimeSense PS1080 depth camera"
license = "Apache-2.0"
repository = "https://github.com/thomas7475/xtion-rs"
keywords = ["xtion", "primesense", "ps1080", "depth-camera", "usb"]
categories = ["hardware-support", "multimedia::video"]

[lib]
name = "xtion"
path = "src/lib.rs"

[dependencies]
rusb = "0.9"
# Raw libusb bindings (same version rusb 0.9 uses): the bulk stream ring
# needs libusb's async transfer API, which rusb does not expose.
libusb1-sys = "0.7"
libc = "0.2"
thiserror = "2"
log = "0.4"

[dev-dependencies]
env_logger = "0.11"

[[example]]
name = "list"
path = "examples/list.rs"

[[example]]
name = "depth_dump"
path = "examples/depth_dump.rs"

[[example]]
name = "raw_dump"
path = "examples/raw_dump.rs"

[[example]]
name = "ir_dump"
path = "examples/ir_dump.rs"
